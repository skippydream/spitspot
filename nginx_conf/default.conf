server {
    listen 80;
    server_name _;

    charset     utf-8;
    client_max_body_size 75M;

    location / {
        include /etc/nginx/uwsgi_params;
        uwsgi_pass unix:///tmp/uwsgi.sock;
    }

    location /static/ {
        alias /app/static/;
    }

    location /media/ {
        alias /app/media/;
    }
}
